<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7B8C9D" stroke-width="1.3"/></marker><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#223849" flood-opacity=".08"/></filter></defs><g style="font-family:'Segoe UI','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1250" height="820" rx="0" fill="#F5F7FA" stroke="#F5F7FA"/><text x="54" y="59" font-size="30" fill="#202D3A" font-weight="650">Windows 分批收集 · 交互流程</text><text x="54" y="89" font-size="13" fill="#697B8C" font-weight="400">设计草案 02  /  2026-10-04  /  先确认交互，再进入产品开发</text><text x="54" y="127" font-size="14" fill="#087F6C" font-weight="500">主路径：收集 → 选择去向 → 明确确认；会话备注不阻断交付。</text><rect x="54" y="170" width="200" height="134" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><rect x="68" y="184" width="25" height="25" rx="8" fill="#EEF2F6" stroke="none"/><text x="76" y="202" font-size="12" fill="#526677" font-weight="600">1</text><text x="68" y="234" font-size="17" fill="#202D3A" font-weight="600">从微信分享</text><text x="68" y="258" font-size="12" fill="#697B8C" font-weight="400">用户手动选择记录</text><text x="68" y="278" font-size="12" fill="#697B8C" font-weight="400">分享至「分批收集」</text><rect x="288" y="170" width="200" height="134" rx="14" fill="#E7F5EF" stroke="#9FD5C6"/><rect x="302" y="184" width="25" height="25" rx="8" fill="#087F6C" stroke="none"/><text x="310" y="202" font-size="12" fill="white" font-weight="600">2</text><text x="302" y="234" font-size="17" fill="#202D3A" font-weight="600">安全落盘 · 收集中</text><text x="302" y="258" font-size="12" fill="#697B8C" font-weight="400">只在保存成功后增加批数</text><text x="302" y="278" font-size="12" fill="#697B8C" font-weight="400">保持小浮条，不抢微信焦点</text><rect x="522" y="170" width="200" height="134" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><rect x="536" y="184" width="25" height="25" rx="8" fill="#EEF2F6" stroke="none"/><text x="544" y="202" font-size="12" fill="#526677" font-weight="600">3</text><text x="536" y="234" font-size="17" fill="#202D3A" font-weight="600">选择去向</text><text x="536" y="258" font-size="12" fill="#697B8C" font-weight="400">已安装应用 / 复制 / 文件夹</text><text x="536" y="278" font-size="12" fill="#697B8C" font-weight="400">目标单选，场景按需出现</text><rect x="756" y="170" width="200" height="134" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><rect x="770" y="184" width="25" height="25" rx="8" fill="#EEF2F6" stroke="none"/><text x="778" y="202" font-size="12" fill="#526677" font-weight="600">4</text><text x="770" y="234" font-size="17" fill="#202D3A" font-weight="600">确认并交付</text><text x="770" y="258" font-size="12" fill="#697B8C" font-weight="400">用户点击明确的操作按钮</text><text x="770" y="278" font-size="12" fill="#697B8C" font-weight="400">冻结本次成员，原包交付</text><rect x="990" y="170" width="200" height="134" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><rect x="1004" y="184" width="25" height="25" rx="8" fill="#EEF2F6" stroke="none"/><text x="1012" y="202" font-size="12" fill="#526677" font-weight="600">5</text><text x="1004" y="234" font-size="17" fill="#202D3A" font-weight="600">结果反馈</text><text x="1004" y="258" font-size="12" fill="#697B8C" font-weight="400">复制 / 保存 / 执行粘贴分开</text><text x="1004" y="278" font-size="12" fill="#697B8C" font-weight="400">收到新批次进入下一组</text><path d="M262,235 L280,235" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M496,235 L514,235" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M730,235 L748,235" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M964,235 L982,235" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="54" y="390" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><rect x="68" y="404" width="25" height="25" rx="8" fill="#EEF2F6" stroke="none"/><text x="76" y="422" font-size="12" fill="#526677" font-weight="600">H</text><text x="68" y="454" font-size="17" fill="#202D3A" font-weight="600">隐藏浮条</text><text x="68" y="478" font-size="12" fill="#697B8C" font-weight="400">已有文件和收集状态保留</text><text x="68" y="498" font-size="12" fill="#697B8C" font-weight="400">从托盘 / 记录页恢复</text><rect x="288" y="390" width="200" height="114" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><rect x="302" y="404" width="25" height="25" rx="8" fill="#EEF2F6" stroke="none"/><text x="310" y="422" font-size="12" fill="#526677" font-weight="600">D</text><text x="302" y="454" font-size="17" fill="#202D3A" font-weight="600">独立批次详情</text><text x="302" y="478" font-size="12" fill="#697B8C" font-weight="400">切换批次 · 查看首尾</text><text x="302" y="498" font-size="12" fill="#697B8C" font-weight="400">可选备注 · 移出本组</text><path d="M316,305 L316,343 L154,343 L154,382" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)"/><text x="69" y="332" font-size="11" fill="#697B8C" font-weight="400">隐藏 / 关闭</text><path d="M54,443 L30,443 L30,151 L388,151 L388,162" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="54" y="151" font-size="10" fill="#697B8C" font-weight="400">托盘 / 记录恢复</text><path d="M365,306 L365,382" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)"/><text x="296" y="354" font-size="11" fill="#697B8C" font-weight="400">查看批次</text><path d="M416,389 L416,312" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)"/><text x="429" y="354" font-size="11" fill="#697B8C" font-weight="400">关闭详情</text><path d="M622,306 L622,350 L500,350 L500,284 L496,284" fill="none" stroke="#7B8C9D" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="519" y="339" font-size="11" fill="#697B8C" font-weight="400">取消 / Esc：返回收集</text><rect x="522" y="390" width="434" height="114" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><text x="540" y="421" font-size="16" fill="#202D3A" font-weight="600">交付期间收到新批次</text><text x="540" y="447" font-size="13" fill="#697B8C" font-weight="400">进入新收集，不混入正在交付的快照。</text><text x="540" y="470" font-size="13" fill="#697B8C" font-weight="400">新浮条提示「本批已加入新的收集」。</text><text x="54" y="551" font-size="17" fill="#202D3A" font-weight="600">异常与可逆操作</text><rect x="54" y="575" width="354" height="133" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><text x="70" y="606" font-size="16" fill="#202D3A" font-weight="600">这一批保存失败</text><text x="70" y="634" font-size="12" fill="#697B8C" font-weight="400">前面的批次不回滚，也不增加已收数量。</text><text x="70" y="657" font-size="12" fill="#697B8C" font-weight="400">提示回微信重新分享这一批。</text><rect x="446" y="575" width="354" height="133" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><text x="462" y="606" font-size="16" fill="#202D3A" font-weight="600">交付失败</text><text x="462" y="634" font-size="12" fill="#697B8C" font-weight="400">保留整组原始文件，状态为「待重试」。</text><text x="462" y="657" font-size="12" fill="#697B8C" font-weight="400">可重试 / 换目标 / 复制文件。</text><rect x="838" y="575" width="354" height="133" rx="14" fill="#FFFFFF" stroke="#E0E7EC"/><text x="854" y="606" font-size="16" fill="#202D3A" font-weight="600">移出 / 删除</text><text x="854" y="634" font-size="12" fill="#697B8C" font-weight="400">移出仅解除归属，原文件仍在记录页。</text><text x="854" y="657" font-size="12" fill="#697B8C" font-weight="400">删除至回收站需确认；操作后可撤销。</text><text x="54" y="758" font-size="12" fill="#087F6C" font-weight="600">安装校验</text><text x="136" y="758" font-size="12" fill="#697B8C" font-weight="400">未安装的应用不能开启入口，且不会出现在交付目标中。</text><text x="54" y="785" font-size="12" fill="#087F6C" font-weight="600">成功边界</text><text x="136" y="785" font-size="12" fill="#697B8C" font-weight="400">「已执行粘贴」不等于上传成功，也不等于消息已发送。</text><rect x="990" y="390" width="200" height="114" rx="14" fill="white" stroke="#E0E7EC"/>
<text x="1006" y="421" font-size="16" fill="#202D3A" font-weight="600">自绘目录选择</text>
<text x="1006" y="447" font-size="12" fill="#697B8C">最近位置 / 路径 / 子目录</text>
<text x="1006" y="470" font-size="12" fill="#697B8C">取消返回，不写入文件</text>
<path d="M722,285 L738,285 L738,369 L1090,369 L1090,382" fill="none" stroke="#7B8C9D" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="955" y="359" font-size="11" fill="#697B8C">保存到文件夹</text>
</g></svg>