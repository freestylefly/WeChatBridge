>稍后前往目标应用手动粘贴</text><circle cx="1356" cy="494" r="8" fill="none" stroke="#C8D2DA"/><rect width="434" height="70" x="946" y="540" fill="#F1F5F7" stroke="none" rx="12"/><rect width="36" height="36" x="958" y="557" fill="#FFF" stroke="none" rx="10"/><text x="966" y="580" fill="#087F6C" font-size="12" font-weight="600">↓</text><text x="1005" y="570" fill="#202D3A" font-size="13" font-weight="600">保存到文件夹</text><text x="1005" y="591" fill="#697B8C" font-size="10" font-weight="400">原始 ZIP 完整保存，不重新打包</text><circle cx="1356" cy="575" r="8" fill="none" stroke="#C8D2DA"/><text x="946" y="650" fill="#697B8C" font-size="11" font-weight="400">附加场景（可选，仅应用目标显示）</text><rect width="434" height="40" x="946" y="664" fill="#F1F5F7" stroke="none" rx="10"/><text x="960" y="689" fill="#202D3A" font-size="12" font-weight="400">直接附加，不使用场景</text><text x="1353" y="687" fill="#697B8C" font-size="16" font-weight="400">⌄</text><text x="946" y="735" fill="#697B8C" font-size="11" font-weight="400">附加后，请在目标应用确认附件。</text><rect width="123" height="38" x="946" y="781" fill="#F1F5F7" stroke="none" rx="10"/><text x="960" y="805" fill="#526677" font-size="12" font-weight="500">继续收集</text><rect width="186" height="38" x="1194" y="781" fill="#087F6C" stroke="none" rx="10"/><text x="1208" y="805" fill="#fff" font-size="12" font-weight="500">附加到 Codex</text><text x="48" y="917" fill="#087F6C" font-size="13" font-weight="600">组件约定</text><text x="136" y="917" fill="#697B8C" font-size="13" font-weight="400">统一圆角、字级与间距；自绘按钮、输入、批次切换、下拉、滚动条、菜单与目标卡片。</text><text x="48" y="944" fill="#087F6C" font-size="13" font-weight="600">交互约定</text><text x="136" y="944" fill="#697B8C" font-size="13" font-weight="400">备注可选；关闭不清空；取消不冻结；交付失败可回到原组；移出不删除文件。</text></g></svg>