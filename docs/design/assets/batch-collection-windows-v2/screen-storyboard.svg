<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="980" viewBox="0 0 1450 980"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7B8C9D" stroke-width="1.3"/></marker><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#223849" flood-opacity=".08"/></filter></defs><g style="font-family:'Segoe UI','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1450" height="980" rx="0" fill="#F5F7FA" stroke="#F5F7FA"/><text x="48" y="59" font-size="30" fill="#202D3A" font-weight="650">三个独立任务，三个清晰界面</text><text x="48" y="89" font-size="14" fill="#697B8C" font-weight="400">自定义组件设计草案  /  浮条不扩成长列表  /  详情与交付按需打开</text><text x="48" y="136" font-size="17" fill="#202D3A" font-weight="600">01  收集浮条</text><text x="48" y="158" font-size="12" fill="#697B8C" font-weight="400">小尺寸，陪伴微信收集</text><text x="424" y="136" font-size="17" fill="#202D3A" font-weight="600">02  批次详情</text><text x="424" y="158" font-size="12" fill="#697B8C" font-weight="400">独立面板，核对与整理</text><text x="924" y="136" font-size="17" fill="#202D3A" font-weight="600">03  选择去向</text><text x="924" y="158" font-size="12" fill="#697B8C" font-weight="400">确认前不执行任何交付</text><g filter="url(#shadow)"><rect x="48" y="184" width="344" height="351" rx="20" fill="#FFFFFF" stroke="#E0E7EC"/></g><rect x="68" y="206" width="37" height="37" rx="11" fill="#E7F5EF" stroke="none"/><text x="77" y="231" font-size="22" fill="#087F6C" font-weight="400">▱</text><text x="116" y="222" font-size="16" fill="#202D3A" font-weight="600">聊天收集</text><rect x="116" y="232" width="57" height="21" rx="6" fill="#E7F5EF" stroke="none"/><text x="124" y="247" font-size="10" fill="#087F6C" font-weight="500">收集中</text><text x="332" y="222" font-size="18" fill="#697B8C" font-weight="400">···</text><path d="M359,209 l10,10 M369,209 l-10,10" stroke="#8292A1" stroke-width="1.5"/><text x="68" y="290" font-size