<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="980" viewBox="0 0 1450 980"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="none" stroke="#7B8C9D" stroke-width="1.3" d="M0,0 L6,3 L0,6"/></marker><filter id="shadow" width="160%" height="160%" x="-30%" y="-30%"><feDropShadow dx="0" dy="7" flood-color="#223849" flood-opacity=".08" stdDeviation="10"/></filter></defs><g style="font-family:'Segoe UI','Microsoft YaHei',sans-serif"><rect width="1450" height="980" x="0" y="0" fill="#F5F7FA" stroke="#F5F7FA" rx="0"/><text x="48" y="59" fill="#202D3A" font-size="30" font-weight="650">三个独立任务，三个清晰界面</text><text x="48" y="89" fill="#697B8C" font-size="14" font-weight="400">自定义组件设计草案 / 浮条不扩成长列表 / 详情与交付按需打开</text><text x="48" y="136" fill="#202D3A" font-size="17" font-weight="600">01 收集浮条</text><text x="48" y="158" fill="#697B8C" font-size="12" font-weight="400">小尺寸，陪伴微信收集</text><text x="424" y="136" fill="#202D3A" font-size="17" font-weight="600">02 批次详情</text><text x="424" y="158" fill="#697B8C" font-size="12" font-weight="400">独立面板，核对与整理</text><text x="924" y="136" fill="#202D3A" font-size="17" font-weight="600">03 选择去向</text><text x="924" y="158" fill="#697B8C" font-size="12" font-weight="400">确认前不执行任何交付</text><g filter="url(#shadow)"><rect width="344" height="351" x="48" y="184" fill="#FFF" stroke="#E0E7EC" rx="20"/></g><rect width="37" height="37" x="68" y="206" fill="#E7F5EF" stroke="none" rx="11"/><text x="77" y="231" fill="#087F6C" font-size="22" font-weight="400">▱</text><text x="116" y="222" fill="#202D3A" font-size="16" font-weight="600">聊天收集</text><rect width="57" height="21" x="116" y="232" fill="#E7F5EF" stroke="none" rx="6"/><text x="124" y="247" fill="#087F6C" font-size="10" font-weight="500">收集中</text><text x="332" y="222" fill="#697B8C" font-size="18" font-weight="400">···</text><path stroke="#8292A1" stroke-width="1.5" d="M359,209 l10,10 M369,209 l-10,10"/><text x="68" y="290" fill="#202D3A" font-size="24" font-weight="600">3 批 · 24.8 MB</text><text x="68" y="315" fill="#697B8C" font-size="12" font-weight="400">已识别约 286 条消息</text><rect width="304" height="82" x="68" y="337" fill="#F1F5F7" stroke="none" rx="12"/><text x="81" y="360" fill="#697B8C" font-size="10" font-weight="400">最近收到</text><text x="311" y="360" fill="#697B8C" font-size="10" font-weight="400">第 3 批</text><text x="81" y="383" fill="#202D3A" font-size="13" font-weight="500">未添加会话备注</text><text x="81" y="404" fill="#697B8C" font-size="11" font-weight="400">20:47 — 21:08</text><text x="68" y="446" fill="#697B8C" font-size="11" font-weight="400">继续在微信分享，下一批会追加到这里。</text><rect width="106" height="38" x="68" y="471" fill="#F1F5F7" stroke="none" rx="10"/><text x="82" y="495" fill="#526677" font-size="12" font-weight="500">查看 3 批</text><rect width="173" height="38" x="199" y="471" fill="#087F6C" stroke="none" rx="10"/><text x="213" y="495" fill="#fff" font-size="12" font-weight="500">选择去向 →</text><rect width="344" height="112" x="48" y="566" fill="#EDF4F1" stroke="none" rx="14"/><text x="64" y="594" fill="#087F6C" font-size="13" font-weight="600">保存中的表现</text><text x="64" y="620" fill="#202D3A" font-size="13" font-weight="400">正在保存第 4 批…</text><text x="64" y="645" fill="#697B8C" font-size="11" font-weight="400">落盘成功后才更新已收批数，不显示百分比。</text><g filter="url(#shadow)"><rect width="468" height="663" x="424" y="184" fill="#FFF" stroke="#E0E7EC" rx="20"/></g><text x="446" y="222" fill="#202D3A" font-size="19" font-weight="600">批次详情</text><path stroke="#8292A1" stroke-width="1.5" d="M859,208 l10,10 M869,208 l-10,10"/><text x="446" y="250" fill="#697B8C" font-size="11" font-weight="400">仅核对你已分享的内容，不代替微信选取。</text><rect width="424" height="40" x="446" y="271" fill="#F1F5F7" stroke="none" rx="10"/><text x="490" y="297" fill="#697B8C" font-size="12" font-weight="400">第 1 批</text><text x="627" y="297" fill="#697B8C" font-size="12" font-weight="400">第 2 批</text><rect width="132" height="30" x="725" y="276" fill="#FFF" stroke="none" rx="8"/><text x="764" y="297" fill="#087F6C" font-size="12" font-weight="600">第 3 批</text><text x="446" y="341" fill="#202D3A" font-size="12" font-weight="500">第 3 批 · 约 86 条 · 6.8 MB</text><rect width="424" height="43" x="446" y="357" fill="#F5F7F9" stroke="#E0E7EC" rx="10"/><text x="460" y="383" fill="#697B8C" font-size="12" font-weight="400">会话备注（可选）</text><text x="817" y="383" fill="#087F6C" font-size="11" font-weight="400">编辑</text><text x="446" y="423" fill="#697B8C" font-size="11" font-weight="400">2026-10-04 20:47 — 21:08</text><rect width="424" height="115" x="446" y="442" fill="#F1F5F7" stroke="none" rx="12"/><text x="460" y="466" fill="#087F6C" font-size="10" font-weight="600">首条</text><text x="774" y="466" fill="#697B8C" font-size="10" font-weight="400">复制文字</text><text x="460" y="488" fill="#697B8C" font-size="10" font-weight="400">小林 · 20:47</text><text x="460" y="514" fill="#202D3A" font-size="13" font-weight="400">这一批补上交互说明。</text><text x="460" y="535" fill="#202D3A" font-size="13" font-weight="400">图片和附件也保留原始文件。</text><rect width="424" height="115" x="446" y="571" fill="#F1F5F7" stroke="none" rx="12"/><text x="460" y="595" fill="#087F6C" font-size="10" font-weight="600">末条</text><text x="774" y="595" fill="#697B8C" font-size="10" font-weight="400">复制文字</text><text x="460" y="617" fill="#697B8C" font-size="10" font-weight="400">阿明 · 21:08</text><text x="460" y="643" fill="#202D3A" font-size="13" font-weight="400">收到，收齐后统一整理成资料，</text><text x="460" y="664" fill="#202D3A" font-size="13" font-weight="400">不用一批一批地发送。</text><text x="446" y="719" fill="#697B8C" font-size="11" font-weight="400">⌄ 更多定位参考</text><text x="446" y="752" fill="#697B8C" font-size="11" font-weight="400">备注可用于本组其他批次，不覆盖已有备注。</text><rect width="144" height="38" x="446" y="781" fill="#F1F5F7" stroke="none" rx="10"/><text x="460" y="805" fill="#526677" font-size="12" font-weight="500">查看原始文件</text><rect width="132" height="38" x="606" y="781" fill="#F1F5F7" stroke="none"