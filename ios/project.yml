# Generated project: run `xcodegen generate` in this folder. The .xcodeproj is
# not committed, so two branches never conflict over pbxproj.
name: WeChatBridge
options:
  bundleIdPrefix: com.xiangming
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# The app and its extensions must carry the same version; TestFlight needs a
# higher CURRENT_PROJECT_VERSION on every upload.
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  WeChatBridgeKit:
    path: ../macos
targets:
  WeChatBridgeiOS:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - LiveActivity
      - Resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WeChatBridgeKit
        product: WeChatBridgeCore
      - target: WeChatBridgeiOSShare
      - target: WeChatBridgeiOSCollect
      - target: WeChatBridgeiOSWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WeChatBridgeiOSShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WeChatBridgeKit
        product: WeChatBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
  # 「分批收集到微信流」 in the share sheet's action list: the same import,
  # each batch added to the open collection (see Shared/CollectMarker.swift).
  WeChatBridgeiOSCollect:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      # The action list draws this icon as a template: a transparent glyph.
      - CollectExtension
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WeChatBridgeKit
        product: WeChatBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).collect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/Collect-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
  WeChatBridgeiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - LiveActivity
      # Shared with the app for the target logos, the app glyph and the accent.
      - path: Resources/Assets.xcassets
      # The Live Activity code it compiles reads UserDefaults.
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
  WeChatBridgeiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: WeChatBridgeiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WeChatBridgeiOS.app/WeChatBridgeiOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WeChatBridgeiOS:
    build:
      targets:
        WeChatBridgeiOS: all
        WeChatBridgeiOSShare: all
        WeChatBridgeiOSCollect: all
        WeChatBridgeiOSWidget: all
    test:
      targets:
        - WeChatBridgeiOSTests
