# Generated project: run `xcodegen generate` in this folder. The .xcodeproj is
# not committed, so two branches never conflict over pbxproj.
name: WeChatBridge
options:
  bundleIdPrefix: com.xiangming
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  WeChatBridgeKit:
    path: ../macos
targets:
  WeChatBridgeiOS:
    type: application
    platform: iOS
    sources:
      - App
      - Resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WeChatBridgeKit
        product: WeChatBridgeCore
      - target: WeChatBridgeiOSShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiangming.wechatbridge.ios
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  WeChatBridgeiOSShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WeChatBridgeKit
        product: WeChatBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiangming.wechatbridge.ios.share
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  WeChatBridgeiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: WeChatBridgeiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiangming.wechatbridge.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WeChatBridgeiOS.app/WeChatBridgeiOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WeChatBridgeiOS:
    build:
      targets:
        WeChatBridgeiOS: all
        WeChatBridgeiOSShare: all
    test:
      targets:
        - WeChatBridgeiOSTests
